# firm_marketing (module 2): marketing materials published by the KNF-listed firms themselves.
# Brands = brand_aliases.json (every brand there is verified in the KNF registry). Only content whose owner
# is the firm is stored: web pages on the firm's own domains, YouTube videos from a channel named after the firm.
#
# Web queries, in this order (rotated by MAX_QUERIES_PER_RUN):
#   1. every URL from `pages` - fetched directly (no search engine), rendered and screenshotted;
#   2. "site:<first domain> <phrase>" for every brand x every phrase in `site_phrases`;
#   3. "site:<domain> <phrase>" for the other registered investment firms (`registry_site_phrases`).
# YouTube queries: every brand's first alias x every template in `youtube_templates`.
# Domains: added to the brand's `domains` from brand_aliases.json; a subdomain matches its parent domain.
# Every page was checked live on 2026-11-21 (status, redirect stays on the firm's domain). Pages answering 403 to
# plain HTTP (bot walls: Plus500, Trading 212, Admirals, Revolut, FxPro, ...) are kept - the browser fallback renders
# them. A page that later breaks is skipped without failing the job.

site_phrases:
  - "promocja"
  - "bonus"
  - "oferta specjalna"
  - "zysk"
  - "zacznij inwestować"
  - "konto inwestycyjne"

# the other registered investment firms with a known domain (registry / firm_domains.json, mostly cross-border):
# "site:<domain> <phrase>" for each phrase, after all brand queries
registry_site_phrases:
  - "inwestycje"

youtube_templates:
  - "{alias}"
  - "{alias} promocja"

# Brands from brand_aliases.json (module 1 list: retail brands, incl. cross-border firms - an extension of the
