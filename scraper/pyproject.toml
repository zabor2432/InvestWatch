[project]
name = "investwatch-scraper"
version = "0.1.0"
description = "InvestWatch scraper: collectors, job queue, firm registry sync"
requires-python = ">=3.12,<3.13"
dependencies = [
    "investwatch-common",
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "httpx==0.28.1",
    "rq==3.0.0",
    "redis==8.1.0",
    "croniter==7.0.0",
    "structlog==26.1.0",
    "PyYAML==6.0.4",
    "yt-dlp==2026.10.26",
    "trafilatura==2.3.1",
    "selectolax==1.0.2",
    "lingua-language-detector==2.2.0",
    "boto3==1.44.9",
    "playwright==1.65.2",
]

[tool.uv]
package = false  # application, not a library

[tool.uv.sources]
investwatch-common = { path = "../common" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "E501",  # long lines: the code base is formatted to 120, not enforced
    "B008",  # FastAPI Query()/Depends() in defaults is the framework idiom
    "S311",  # random is used for request jitter and User-Agent rotation, not for secrets
]

[tool.ruff.lint.isort]
known-first-party = ["investwatch_common"]
known-local-folder = ["app"]  # layout used here: stdlib, third party, investwatch_common, app

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
