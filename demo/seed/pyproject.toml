[project]
name = "demo-seed"
version = "0.1.0"
description = "Puts the demo records into the pipeline bucket (stand-in for the scraper)"
requires-python = ">=3.12,<3.14"
dependencies = ["boto3>=1.35"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "../../common"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
