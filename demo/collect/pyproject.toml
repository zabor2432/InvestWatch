[project]
name = "demo-collect"
version = "0.1.0"
description = "Dev tool: collects public pages (text + desktop/mobile screenshots) and builds manipulated variants for tests"
requires-python = ">=3.12,<3.14"
dependencies = ["playwright>=1.49", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
