# SearXNG for the scraper (internal only, not exposed on the host).
use_default_settings: true

general:
  instance_name: "investwatch-search"

search:
  safe_search: 0
  default_lang: "pl"
  formats:
    - html
    - json   # the scraper uses /search?format=json

server:
  # secret_key comes from SEARXNG_SECRET (docker-compose)
  limiter: false        # no bot limiter: the only client is the scraper
  image_proxy: false
  public_instance: false

outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0
