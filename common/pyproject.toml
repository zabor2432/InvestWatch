[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[project]
name = "investwatch-common"
version = "0.1.0"
description = "Shared SQLAlchemy models, enums and DB session for InvestWatch services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "SQLAlchemy==2.1.9",
    "psycopg[binary]==3.3.9",
    "Unidecode==1.4.0",
]

[tool.uv.build-backend]
module-name = "investwatch_common"
module-root = ""
