[project]
name = "orchestrator"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "dagster-postgres>=0.25",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "pydantic>=2",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S608", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
